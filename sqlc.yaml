version: "2"
sql:
  - engine: "postgresql"
    queries: "nmosdb/queries"
    schema: "nmosdb/migrations"
    gen:
      go:
        package: "nmosdb"
        sql_package: "pgx/v5"
        out: "nmosdb"
        overrides:
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true